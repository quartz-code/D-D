# Прогон тестов квеста при каждом изменении.
name: Тесты

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  тесты:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Нижняя граница поддержки и текущая версия.
        python: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Поставить Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Проверить, что утилиты для головоломок на месте
        run: |
          # Имена переменных оболочки — только латиницей: bash кириллицу
          # в идентификаторах не принимает.
          for tool in file gzip unzip tar base64 rev tac; do
            command -v "$tool" >/dev/null || { echo "нет утилиты $tool"; exit 1; }
          done

      - name: Тесты
        env:
          # Квест целиком на русском: без UTF-8 часть утилит ведёт себя странно.
          LC_ALL: C.UTF-8
          LANG: C.UTF-8
        run: python -m unittest discover -s tests -t . -v

      - name: Сквозная проверка раскладок
        env:
          LC_ALL: C.UTF-8
          LANG: C.UTF-8
        run: |
          # Каждая раскладка каждого пакета должна собираться и проверяться.
          for layout in templates/*/layout*.json examples/*/layout*.json; do
            echo "--- $layout ---"
            python run_seed.py разложить --раскладка "$layout" --корень /tmp/quest
            python run_seed.py проверить --раскладка "$layout" --корень /tmp/quest
            python run_seed.py очистить  --раскладка "$layout" --корень /tmp/quest --да
          done

      - name: Проверка готовности каждого пакета (без сети)
        env:
          LC_ALL: C.UTF-8
          LANG: C.UTF-8
        run: |
          for pack in templates/blank-ru templates/blank-en \
                      examples/entropy-complex-ru examples/entropy-complex-en; do
            echo "--- $pack ---"
            printf '{"content": "%s"}\n' "$pack" > config/config.json
            python run_seed.py разложить
            python run_master.py проверка
          done
          rm -f config/config.json

      - name: Интерфейс на обоих языках
        env:
          LC_ALL: C.UTF-8
          LANG: C.UTF-8
        run: |
          for lang in ru en; do
            printf '{"ui": {"language": "%s"}}\n' "$lang" > config/config.json
            python run_master.py помощь
          done
          rm -f config/config.json
